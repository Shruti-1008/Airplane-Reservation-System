<!DOCTYPE html>
<html>
<head>
<title>Airline</title>
<style>
body {
    margin: 0;
    padding-top: 80px;
    font-family: Arial;
    color: white;
    height: 100vh;

    background: 
        linear-gradient(rgba(2,6,23,0.7), rgba(2,6,23,0.9)),
        url("plane.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    animation: zoomBg 20s ease-in-out infinite alternate;
}
@keyframes zoomBg {
    0% {
        background-size: 100%;
    }
    100% {
        background-size: 110%;
    }
}
/* 🔝 TOP NAVBAR */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between; /* keeps logo left, menu right */
    align-items: center;
    box-sizing: border-box;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}
/* LOGO */
.logo {
    font-size: 20px;
    font-weight: bold;
}
/* BUTTON GROUP */
.nav-buttons {
    display: flex;
    gap: 160px;
    margin-left: 380px; /* 🔥 increase this */
}
.nav-buttons a {
    text-decoration: none;
    color: white;
    font-size: 15px;
    font-weight: 500;
    transition: 0.3s ease;
}
/* 🔥 Hover effect */
.nav-buttons a:hover {
    color: #38bdf8;
}
.nav-buttons button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(56,189,248,0.4);
}
/* HERO SECTION */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.hero-content {
    text-align: center;
}
.hero h1 {
    font-size: 48px;
    color: aliceblue;
    text-shadow: 
        0 0 10px rgba(255,255,255,0.3),
        0 0 20px rgba(56,189,248,0.6),
        0 0 40px rgba(99,102,241,0.8);
}
.hero p {
    color: #94a3b8;
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
   
}
.hero button {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: white;
    cursor: pointer;
}
.bottom-planes {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 150px;
    pointer-events: none;
    overflow: hidden;
}
.bottom-planes img {
    position: absolute;
    bottom: 10px;
    opacity: 0.2;
    animation: flyBottom linear infinite;
}
.clouds {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
    top: 0;
    left: 0;
    overflow: hidden;
}

.cloud {
    position: absolute;
    width: 200px;
    opacity: 0.08;
    animation: floatCloud linear infinite;
}

.cloud:nth-child(1) {
    top: 20%;
    animation-duration: 60s;
}

.cloud:nth-child(2) {
    top: 50%;
    animation-duration: 80s;
}

.cloud:nth-child(3) {
    top: 70%;
    animation-duration: 70s;
}

@keyframes floatCloud {
    0% {
        left: -250px;
    }
    100% {
        left: 110%;
    }
}
@keyframes flyBottom {
    0% {
        left: -50px;
        transform: translateY(0) rotate(5deg);
    }
    50% {
        transform: translateY(-10px) rotate(2deg);
    }
    100% {
        left: 110%;
        transform: translateY(0) rotate(5deg);
    }
}
</style>
</head>
<body>
<div class="clouds">
    <img class="cloud" src="https://cdn-icons-png.flaticon.com/512/414/414927.png">
    <img class="cloud" src="https://cdn-icons-png.flaticon.com/512/414/414927.png">
    <img class="cloud" src="https://cdn-icons-png.flaticon.com/512/414/414927.png">
</div>
<!-- 🔝 NAVBAR -->
<div class="navbar">
    
    <div class="logo">✈ Airline Reservation</div>

    <div class="nav-buttons">
        <a href="home.html">Home</a>
        
        <a href="support.html">Support</a>
        <a href="login.html">Login</a>
    </div>
</div>
<!-- 🚀 HERO -->
<div class="hero">
    <div class="hero-content">
        <h1>Fly Smart. Fly Easy.</h1>
        <p>Book flights, choose seats, and travel smarter.</p>

        <button onclick="goLogin()">Get Started</button>
    </div>
</div>
<div class="bottom-planes"></div>
<script>
function goLogin(){
    window.location.href = "login.html";
}
</script>
<script>
function goHome(){
    window.location.href = "home.html";
}

function goLogin(){
    window.location.href = "login.html";
}

function goApp(){
    window.location.href = "index.html";
}

function goSupport(){
    window.location.href = "support.html";
}
</script>
</body>
</html>
