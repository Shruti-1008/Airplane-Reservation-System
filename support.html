<!DOCTYPE html>
<html>
<head>
<title>Support</title>

<style>
body {
    padding-top: 80px;
    margin: 0;
    font-family: Arial;
    color: white;
    background: #020617;
}

.content {
    margin-top: 100px;
    text-align: center;
}
.navbar {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    padding: 15px 40px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    box-sizing: border-box;

    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.nav-buttons {
    display: flex;
    gap: 25px;
    margin-right: 60px;
}

.nav-buttons a {
    text-decoration: none;
    color: white;
    font-size: 15px;
    font-weight: 500;
}

.nav-buttons a:hover {
    color: #38bdf8;
}
.support-card {
    background: rgba(30,41,59,0.6);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 15px;
    width: 400px;
    margin: auto;

    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.support-card input,
.support-card textarea {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    background: #0f172a;
    color: white;
}

.support-card textarea {
    resize: none;
}

.support-card button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: white;
    cursor: pointer;
}

.support-card button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(56,189,248,0.6);
}
</style>
</head>

<body>
<div class="navbar">
    <div class="logo">✈ Airline Reservation</div>

    <div class="nav-buttons">
        <a href="home.html">Home</a>
        <a href="index.html">Flights</a>
        <a href="support.html">Support</a>
        <a href="login.html">Login</a>
    </div>
</div>
<div class="content">
    <div class="support-card">
        <h1>Support</h1>
        <p>Have a question or issue? Send us a message.</p>

        <input id="userEmail" placeholder="Your Email">
        <input id="subject" placeholder="Subject">
        <textarea id="message" placeholder="Type your message..." rows="5"></textarea>

        <button onclick="sendEmail()">Send Message</button>

        <p style="margin-top:15px;">
            Or email us directly:
            <a href="https://mail.google.com/mail/u/0/#inbox?compose=ZtjgtGMwjhgFLtTwmRPxtRThtwnKDvVLXfLhznRGVHScJGQFhvCTkqdMJbjxrNzgFvtlSxDgQvtZlswbSJfXLSvPmmSxzKrCGGTmJLRQJsFJcrcWQBjZCpfQCnBvVBbptmfWvDCLzfJGQKRsxXhnLqV" style="color:#38bdf8;">
                supportairreserve@gmail.com
            </a>
        </p>
    </div>
</div>
<script>
function sendEmail(){
    let email = document.getElementById("userEmail").value;
    let subject = document.getElementById("subject").value;
    let message = document.getElementById("message").value;

    if(!email || !subject || !message){
        alert("Please fill all fields");
        return;
    }

    let mailLink = `mailto:supportairreserve@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message + "\n\nFrom: " + email)}`;
    window.location.href = mailLink;

    window.open(mailLink, "_blank");
}
</script>
</body>
</html>
